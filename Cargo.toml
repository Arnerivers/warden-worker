[package]
name = "warden-worker"
version = "0.7.0"
edition = "2021"
authors = ["qaz741wsd856"]

[package.metadata.release]
release = false

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = true
codegen-units = 1

[dependencies]
# Worker & Web APIs
worker = { version = "0.8.3", features = ["axum", "http", "d1"] }
worker-macros = { version = "0.8.3", features = ['http'] }
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Crypto", "CryptoKey", "SubtleCrypto", "UrlSearchParams", "WorkerGlobalScope", "Pbkdf2Params"] }
console_error_panic_hook = "0.1.7"
wasm-streams = "0.5"

# Axum and Routing
axum = { version = "0.8", default-features = false, features=["json", "macros", "form", "multipart", "query"] }
tower-service = "0.3"
tower-http = { version = "0.6", features = ["cors"] }
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
url = "2"

# Data & Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmpv = "1.3"

# Crypto & Encoding
# We only use HS256 (HMAC) + standard JSON claims. Disable default `ciborium` feature to reduce deps.
jwt-compact = { version = "0.8", default-features = false, features = ["std", "clock"] }
base64 = "0.22"
base32 = "0.5"
pbkdf2 = "0.13"
sha2 = "0.11"
hex = "0.4"
getrandom = { version = "0.4", features = ["wasm_js"] }
constant_time_eq = "0.4"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.23", features = ["v4", "serde", "rng-getrandom"] }
log = "0.4"
thiserror = "1.0"
once_cell = "1.21"
console_log = "1.0.0"
glob-match = "0.2"

# WebAuthn / Passkey
passkey-server = { version = "0.1", default-features = false, features = ["wasm"] }
async-trait = "0.1"
# passkey-server pulls getrandom 0.2 via p256 -> rand_core; enable WASM support
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
